name: SystemX inline card radius arm64e
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # macOS arm64 hosted capacity has been unavailable; use the Intel labelled image
    # and cross-compile the arm64e slice with Xcode's iPhoneOS SDK.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: brew install dpkg
      - name: Validate machine code and inline patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 -m venv build/venv
          build/venv/bin/pip install unicorn
          build/venv/bin/python tools/test_main_machine.py
          python3 repack_clearbutton.py -o build/base23.deb
          dpkg-deb -x build/base23.deb build/base
          python3 tools/patch_radius_main.py build/base/Library/MobileSubstrate/DynamicLibraries/SystemBox.dylib build/SystemBox.dylib
          xcrun lipo build/SystemBox.dylib -thin arm64 -output build/original-arm64.dylib
          xcrun lipo build/SystemBox.dylib -thin arm64e -output build/patched-arm64e.dylib
          codesign --force --sign - --timestamp=none build/patched-arm64e.dylib
          codesign --verify --strict --verbose=2 build/patched-arm64e.dylib
          xcrun lipo -create build/original-arm64.dylib build/patched-arm64e.dylib -output build/SystemBox.dylib
          codesign --verify --strict --all-architectures --verbose=2 build/SystemBox.dylib
          xcrun otool -hv build/SystemBox.dylib > build/macho-header.txt
          xcrun otool -L build/SystemBox.dylib > build/dependencies.txt
      - name: Package inline main library and validate
        run: |
          python3 tools/package_card_radius.py --library build/SystemBox.dylib --output build/com.wkk.systembox_1.5-8-26_iphoneos-arm64e.deb
          python3 tools/verify_main_radius.py build/com.wkk.systembox_1.5-8-26_iphoneos-arm64e.deb build/verification.json
          shasum -a 256 build/*.deb build/*.dylib > build/SHA256SUMS
          rm -rf build/venv build/base build/base23.deb
      - uses: actions/upload-artifact@v4
        with:
          name: SystemX-1.5-8-26-arm64e
          path: build/
          if-no-files-found: error
          retention-days: 30
